skill: catalog-compatibility
gate: []
outputs:
- id: plant-grid
  form: "In `assets/compatibility-check.md`: controller vendor, field network, ingress variant, tool versions, tag language and instance state per plant"
  template: assets/compatibility-check.md
  to_skills: []
  to_roles:
  - IIAE
  done_when:
  - Every plant in scope is listed
  - Figures relied on were refreshed from the live lists
  signoff: IIAE
  check:
    structure: true
- id: verdict-per-plant
  form: In the same file
  to_skills:
  - dept-decision-rights
  to_roles:
  - IIAE
  done_when:
  - Each plant is consumable, consumable with mapping, not consumable or unknown
  - Unknown is never rounded to consumable
  - Each mapping is written down and owned
  signoff: IIAE
- id: recommendation
  form: In the same file
  to_skills:
  - dept-decision-rights
  to_roles:
  - (IIAE by consultation
  - COP for a data-model or connector change)
  done_when:
  - Follows the decision table
  - A not-consumable plant leads to a changed standard, a mapping rule or a narrowed scope, never a plant-specific branch
  signoff: (IIAE by consultation
- id: verdict-grid-for-the-catalog
  form: The grid, handed over when the standard feeds the catalog
  to_skills:
  - catalog-usecase
  to_roles: []
  done_when:
  - The entry shows which plants it was checked at and which not
  signoff: OD lead
receives_from:
- mi-signals
- catalog-standardization
- mi-data-availability
- mi-equipment
next:
- when: dept-decision-rights, then catalog-usecase when the standard feeds the catalog.
  to:
  - dept-decision-rights
  - catalog-usecase
stops_when:
- only the first plant's evidence exists (a proposal, not a standard), any plant is not consumable (do not recommend as "standard for all plants"), or more than a few plants are unknown (recommend only for the checked plants)
- The skill recommends
- it does not decide the data-model change
