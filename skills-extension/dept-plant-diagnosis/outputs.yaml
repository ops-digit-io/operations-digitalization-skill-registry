skill: dept-plant-diagnosis
gate: []
outputs:
- id: plant-gap-diagnosis-record
  form: "`assets/plant-gap-diagnosis-record.md`, filled"
  template: assets/plant-gap-diagnosis-record.md
  to_skills: []
  to_roles:
  - OD lead with the regional lead
  done_when:
  - Fair comparison set stated
  - Each gap placed on an Ishikawa branch with evidence and a confidence label
  - Open unknowns listed with an owner role
  signoff: OD lead with the regional lead
  check:
    structure: true
- id: tier-proposal
  form: Tier section of the record
  to_skills: []
  to_roles:
  - OD lead with the regional lead
  done_when:
  - Plant tiered first mover or fast follower with each criterion answered
  signoff: OD lead with the regional lead
- id: plant-roadmap
  form: "`assets/plant-roadmap-template.md`, filled"
  template: assets/plant-roadmap-template.md
  to_skills:
  - metrics-scorecard
  to_roles: []
  done_when:
  - One row per workstream with owner role, target date, status colour and call-for-action text
  - No row green without named evidence
  signoff: OD lead
  check:
    structure: true
- id: regional-roadmap
  form: Regional roll-up table in the same asset
  to_skills:
  - metrics-scorecard
  to_roles: []
  done_when:
  - Updated from the plant rows
  - Reported per region against plan, not as a blended number
  signoff: OD lead
- id: decision-and-escalation-items
  form: Rows flagged in the roadmap
  to_skills:
  - dept-decision-rights
  - dept-risk
  to_roles: []
  done_when:
  - Tier or wave exceptions, resource requests and open risks (staffing, central IT commitment, key user loss) named with the rows that need a decision
  signoff: OD lead
receives_from:
- dept-plant-onboarding
- bc-portfolio
- mi-equipment
- catalog-compatibility
next:
- when: bc-portfolio (tier as a capacity input and gap reasons at step 24), metrics-scorecard (call and strategy-round inputs), catalog-compatibility (a technical gap on a standard), dept-decision-rights, dept-risk, dept-retro (confirmed lessons).
  to:
  - bc-portfolio
  - metrics-scorecard
  - catalog-compatibility
  - dept-decision-rights
  - dept-risk
  - dept-retro
stops_when:
- the facts are not read from the lists on the day, only zero reported saving is the evidence for "no potential" (only a human may decide that, after the scaling test), a row would be marked green without evidence, or…
