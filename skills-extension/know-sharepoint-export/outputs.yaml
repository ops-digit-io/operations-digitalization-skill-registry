skill: know-sharepoint-export
gate: []
outputs:
- id: list-export
  form: Files landed under `90-Sources/sharepoint/<list>/`
  to_skills:
  - bc-portfolio
  to_roles: []
  done_when:
  - Items, complete item version history, attachment metadata and attachment binaries are exported (never current items only)
  - Counts verified against the list's own item count
  - Not hand-edited
  signoff: OD lead
- id: export-run-log
  form: "`assets/export-run-log.md`, filled"
  template: assets/export-run-log.md
  to_skills:
  - bc-portfolio
  to_roles: []
  done_when:
  - Date, counts, mode (full or incremental) and the schema check result are recorded, so capture date and row counts need no re-deriving
  signoff: OD lead
  check:
    structure: true
- id: schema-check-result
  form: Line in the run log from `scripts/check_export_schema.py`
  to_skills:
  - bc-portfolio
  to_roles:
  - OD lead
  done_when:
  - Result is `OK`, or every finding is carried forward in the log
  signoff: OD lead
receives_from:
- dept-context
next:
- when: bc-portfolio reads the export plus the run log.
  to:
  - bc-portfolio
stops_when:
- counts do not match the list's item count, or the schema check reports a finding before an incremental run
- Carry the finding forward
- do not re-run and hope, and do not present a figure without its capture date
- If an analysis needs deleted binaries, recycle-bin contents, audit-log history, attachment versions or permissions history, this route cannot supply them
