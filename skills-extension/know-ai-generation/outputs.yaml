skill: know-ai-generation
gate: []
outputs:
- id: ai-step-card
  form: "`assets/ai-step-card.md`, filled"
  template: assets/ai-step-card.md
  to_skills: []
  to_roles:
  - Process owner named on the card
  - the skill of the step
  done_when:
  - A human has named the process owner, the data source and the review point (no name, no start)
  - The evidence and the human gate are recorded
  signoff: Process owner named on the card
  check:
    structure: true
- id: generated-output-with-evidence
  form: The output of the step, with the source rows, entries or documents it rests on and the read date
  to_skills: []
  to_roles:
  - Reviewer on the card
  - before anyone outside the team sees it
  done_when:
  - Every element traces to a source field
  - An output without citations is labelled a draft
  signoff: Reviewer on the card
- id: open-item-list
  form: List handed over with the output
  to_skills: []
  to_roles:
  - Reviewer on the card
  done_when:
  - Open items ("to confirm") sit on the list, not in the output
  signoff: Reviewer on the card
- id: missing-signal-and-binding-table
  form: "`assets/missing-signal-and-binding-table.md`, filled (steps 22, 23, 1a2, 3b4)"
  template: assets/missing-signal-and-binding-table.md
  to_skills:
  - mi-data-availability
  to_roles:
  - information-integration lane
  done_when:
  - Missing signals are reported before the dashboard as signal id, label and why needed
  - The binding table shows which tag fed which panel and which query pattern it uses
  signoff: information-integration lane
  check:
    structure: true
receives_from:
- dept-context
- dept-context-freshness
- catalog-template
next:
- when: the skill of the step that asked for the agent (for example ops-analytics-asset, mi-signals, mi-data-availability, invest-screen, deploy-cybersec, deploy-appstore); a person reviews before the output leaves the team.
  to:
  - ops-analytics-asset
  - mi-signals
  - mi-data-availability
  - invest-screen
  - deploy-cybersec
  - deploy-appstore
stops_when:
- the needed context section is stale or has no owner, the process owner, data source or review point is not named, or a signal is missing (never approximated)
- The agent never invents a value, writes to a machine, approves or submits anything
- ranking, go / no-go, Cyber Security sign-off and deployment stay human decisions
