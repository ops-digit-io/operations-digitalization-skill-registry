skill: catalog-standardization
gate: []
outputs:
- id: standardization-review
  form: "`assets/standardization-review.md`, filled as the work happens, one per use case"
  template: assets/standardization-review.md
  to_skills:
  - dept-decision-rights
  - bc-build
  to_roles: []
  done_when:
  - Template placement, library check, cluster baseline and delta, and the CSP-readiness verdict are all filled, so neither receiver has to re-ask
  signoff: OD lead
  check:
    structure: true
- id: capability-and-process-group-placement
  form: Section 1 of the review
  to_skills:
  - dept-decision-rights
  to_roles: []
  done_when:
  - The use case hangs off an existing capability and process group
  - None was created for one plant
  signoff: OD lead
- id: cluster-tag-baseline-and-plant-deltas
  form: Section 3 of the review
  to_skills:
  - bc-build
  to_roles:
  - plant team
  done_when:
  - One classifier-assigned tag (C01-C12, never hand-edited)
  - Standard definition, KPI set and checklist pulled as baseline
  - Only the plant's own deltas recorded
  signoff: plant team
- id: csp-readiness-verdict
  form: Section 4 of the review, only for a rollout candidate
  to_skills:
  - dept-decision-rights
  to_roles:
  - CSP decision outside OD
  done_when:
  - Methods and actions are written down with evidence it works at its first plant
  - A blank or `No` is stated as readiness, not as rejection of the use case
  signoff: CSP decision outside OD
receives_from:
- funnel-workshop
- ops-event-model
- bc-portfolio
- bc-build
next:
- when: Lane 2 step 26 (implement and graduate, with deploy-handover and catalog-usecase).
  to:
  - deploy-handover
  - catalog-usecase
- when: The review goes to dept-decision-rights for the rollout gate and into the business case of bc-build.
  to:
  - dept-decision-rights
  - bc-build
stops_when:
- the library already holds a proven entry for the same capability (take it instead of specifying), or the only evidence of standardization is that templates exist
- Count adoption and utilization, with the read date, not templates
- do not treat a No as a rejection
