skill: funnel-workshop
gate: []
outputs:
- id: agenda-and-pre-read
  form: "`assets/workshop-agenda-and-preread.md`, sent before the workshop"
  template: assets/workshop-agenda-and-preread.md
  to_skills: []
  to_roles:
  - Workshop audience
  - Plant ME
  done_when:
  - Purpose, audience and timeframe were agreed with the plant and the pre-read went out, with the reason for the chosen format order
  signoff: Workshop audience
  check:
    structure: true
- id: workshop-capture-sheet
  form: "`assets/workshop-capture-template.md`, filled during the workshop"
  template: assets/workshop-capture-template.md
  to_skills:
  - funnel-use-case
  - dept-intake
  - bc-portfolio
  to_roles: []
  done_when:
  - Legible to someone who was not present
  - Every demand is logged against the plant roadmap or returned with a reason
  - Savings figures marked with their basis as pre-evaluation
  signoff: OD lead
  check:
    structure: true
- id: follow-up-list-and-summary
  form: "`assets/workshop-follow-up-list.md`"
  template: assets/workshop-follow-up-list.md
  to_skills:
  - bc-build
  - mi-equipment
  - catalog-standardization
  - funnel-first-aid
  to_roles:
  - Plant ME
  - by item type
  done_when:
  - Every item is routed and has an owner role and a date, or is marked "open"
  - The summary reached the Plant ME
  signoff: Plant ME
  check:
    structure: true
- id: utilization-follow-up
  form: Item in the follow-up list (integration workshops)
  to_skills: []
  to_roles:
  - Plant ME
  done_when:
  - The utilization session at the next visit is scheduled
  signoff: Plant ME
receives_from:
- dept-intake
- bc-portfolio
- funnel-requirements
- invest-screen
next:
- when: Lane 2 step 21 (define and diagnose, with funnel-use-case) and Lane 3 step 31 (requirements).
  to:
  - funnel-use-case
- when: Items go to funnel-use-case or dept-intake, mi-equipment, bc-build (savings calculated as a follow-up), bc-portfolio (ranking), catalog-standardization, funnel-first-aid.
  to:
  - funnel-use-case
  - dept-intake
  - mi-equipment
  - bc-build
  - bc-portfolio
  - catalog-standardization
  - funnel-first-aid
stops_when:
- the plant has an ad-hoc process issue and no use case (use funnel-first-aid, not a workshop), or an item would commit investment, machine integration or an external connection in the room
- Such decisions are made elsewhere
- record the rollout dependency instead
