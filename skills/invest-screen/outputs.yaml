skill: invest-screen
gate: []
outputs:
- id: system-fit-check
  form: "`assets/system-fit-check.md`, filled"
  template: assets/system-fit-check.md
  to_skills:
  - dept-intake
  - funnel-requirements
  to_roles:
  - The calling skill (dept-intake or funnel-requirements)
  done_when:
  - The need is restated independent of the request's wording
  - Each tool boundary is checked with a stated reason
  - This plant's availability is checked and dated
  - One verdict (fits, redesign, escalate) and a named next step
  signoff: The calling skill (dept-intake or funnel-requirements)
  check:
    structure: true
- id: existing-system-worksheet-when-a-legacy
  form: "`assets/existing-system-worksheet.md`, filled"
  template: assets/existing-system-worksheet.md
  to_skills: []
  to_roles:
  - OD lead
  - with the check
  done_when:
  - Filled whenever the plant may already run a covering application or tool
  signoff: OD lead
  check:
    structure: true
- id: exception-escalation-verdict-escalate
  form: Decision request via the "Tool/system rollout" row
  to_skills:
  - dept-decision-rights
  to_roles:
  - the OD lead decides together with the IT-responsible role of the business side
  done_when:
  - The boundary line crossed and the dated plant availability are cited
  signoff: the OD lead decides together with the IT-responsible role of the business side
- id: lane-3-gate-result-step-32
  form: Verdict and route in the system fit check
  to_skills:
  - dept-decision-rights
  - deploy-appstore
  - mi-equipment
  to_roles:
  - deploy-appstore (routes 3a.1 and 3a.2)
  - OpenSpec IT demand (external) (routes 3a.3 and 3a.4)
  - mi-equipment (route 3b)
  done_when:
  - Footprint gate has no open point (or the verdict is Blocked)
  - One route (3a.1 to 3a.4 or 3b) with its next skill
  - Six criteria scored with the verdict in the department's words and one decisive reason
  signoff: the OD lead decides together with the IT-responsible role of the business side
receives_from:
- dept-intake
- funnel-requirements
- catalog-systems
- catalog-guardrails
next:
- when: 'fits goes back to the calling skill; redesign re-scopes the request; escalate goes to dept-decision-rights (step 32); the Lane 3 route goes on to OpenSpec IT demand (external), deploy-appstore or mi-equipment, then the business case'
  to:
  - dept-decision-rights
  - deploy-appstore
  - mi-equipment
  - bc-build
stops_when:
- no boundary line can be named, the sources disagree, or the plant status is unknown
- The check is then not finished
- It also stops on a tool nobody runs (a service gap, not a fit)
- It never approves a rollout exception itself
