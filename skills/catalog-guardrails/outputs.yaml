skill: catalog-guardrails
gate: []
outputs:
- id: go-live-check-record
  form: "`assets/go-live-check-record.md`, filled"
  template: assets/go-live-check-record.md
  to_skills: []
  to_roles:
  - Plant owner
  - who decides
  done_when:
  - Every guardrail (G1 to G7 and G7a) has a result (passed / failed / not checked), evidence, date and answering role
  - Use case, plant and plant owner at the top
  - "Final line \"go-live decision: the plant's\""
  signoff: Plant owner
  check:
    structure: true
- id: utilization-expectation
  form: Written into the go-live check record before go-live
  to_skills:
  - deploy-handover
  to_roles:
  - Plant owner
  - then
  done_when:
  - "Stated in the record: who uses the screen, in which meeting, which action follows"
  signoff: Plant owner
- id: routing-of-failed-guardrails
  form: Named in the record
  to_skills:
  - mi-data-availability
  - invest-screen
  - deploy-handover
  - deploy-cybersec
  to_roles:
  - or
  - as the failure says
  done_when:
  - Each failure is routed back with the target skill named
  - None is passed as a warning where it is marked block
  signoff: or
receives_from:
- ops-dashboard-datatron
- catalog-usecase
- catalog-systems
- mi-data-availability
- deploy-handover
next:
- when: step 1a3 and step 1b4 end with the plant's go-live decision; adoption is then checked by deploy-handover.
  to:
  - deploy-handover
stops_when:
- any guardrail failed or has no evidence (it counts as "not checked"), or an external connection lacks Cyber Security sign-off (G7)
- No go-live
- the skill never sets PRODUCTIVE and never marks a failed guardrail as passed
