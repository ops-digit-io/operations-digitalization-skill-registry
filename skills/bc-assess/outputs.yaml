skill: bc-assess
gate: []
outputs:
- id: assessment-report
  form: "`bc-assessment-report.md` next to the case: scorecard with criterion, verdict (pass, partial, gap), evidence and note"
  to_skills:
  - bc-capital-request
  to_roles:
  - OD lead
  done_when:
  - Every rubric criterion scored with evidence (file and section)
  - A criterion that cannot be scored is marked gap with the missing input named
  signoff: OD lead
- id: conflict-register
  form: "Section of the report: every input, what the case drew from it, each conflict and how it was resolved"
  to_skills:
  - bc-build
  to_roles: []
  done_when:
  - Every input file listed
  - Every conflict between sources has a resolution and a reason
  signoff: OD lead
- id: maturity-gate-verdict
  form: "Verdict line in the report: Ready to sign, Sign the floor and validate the upside, or Not ready"
  to_skills:
  - bc-capital-request
  to_roles:
  - approvers
  done_when:
  - One verdict stated
  - Not ready names the missing input and its owner
  - The assessor is not the case builder
  signoff: approvers
- id: ranked-open-questions
  form: Section of the report, normalized influence 0-100, grouped into blocks one conversation can close
  to_skills:
  - bc-build
  to_roles: []
  done_when:
  - Questions ranked and grouped
  signoff: OD lead
receives_from:
- bc-build
- bc-cost
next:
- when: a signable case goes to bc-capital-request (step 25); an unsigned case goes back to bc-build with the findings.
  to:
  - bc-capital-request
  - bc-build
stops_when:
- the assessor is the builder of the case (name a different assessor), or any C criterion is a gap (blocks signing)
- Do not fix the case while assessing it
