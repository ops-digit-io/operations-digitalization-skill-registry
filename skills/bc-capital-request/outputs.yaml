skill: bc-capital-request
gate: []
outputs:
- id: capital-request-package
  form: "`assets/capital-request-package.md`, filled"
  template: assets/capital-request-package.md
  to_skills: []
  to_roles:
  - Human who submits
  - approvers named in the approval matrix
  done_when:
  - Complete or its gaps are named with a role who closes them
  - The ask in one line (amount, what it buys, phase, decision date)
  - Route and approver written next to the amount
  - Tracked and proven euros shown separately, never summed
  - Options include a smaller version and do-nothing
  signoff: Human who submits
  check:
    structure: true
- id: management-summary-deck
  form: Deck from the eCR builder; last slide Open items and conflicts
  to_skills: []
  to_roles:
  - Human who submits
  done_when:
  - Every figure carries its grounding chip
  - Closed with one maturity verdict (Ready to sign, Sign the floor, or Not ready)
  signoff: Human who submits
- id: gate-dependency-on-use-case-and-saving-r
  form: Dependency entry (`ECR CREATION`, then `ECR APPROVAL` once filed) with owner
  to_skills: []
  to_roles:
  - DBVE (owns the savings ledger)
  done_when:
  - Recorded on the use case and on each affected saving row
  - Updated with the outcome after the decision
  signoff: DBVE (owns the savings ledger)
- id: refusal-with-de-risk-questions
  form: Reply listing the de-risk questions, instead of a package
  to_skills: []
  to_roles:
  - Requester
  done_when:
  - Issued when the value backbone, investment estimate or assessment verdict is missing or too thin
  - No package is produced
  signoff: Requester
receives_from:
- bc-build
- bc-cost
- bc-assess
- funnel-prototype
- dept-decision-rights
- funnel-evaluation
next:
- when: the human approvers decide, then deploy-handover (step 26) and the build.
  to:
  - deploy-handover
- when: "Other gates the spend touches: OpenSpec IT demand (external), deploy-cybersec."
  to:
  - deploy-cybersec
stops_when:
- no money needs committing (record that and stop), the value backbone, estimate or verdict is missing (refusal gate), or the package has been handed to a human to review and submit
