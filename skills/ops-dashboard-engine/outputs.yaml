skill: ops-dashboard-engine
gate: []
outputs:
- id: dashboard-json
  form: One Grafana `.json` file generated with `references/dashboard_builder.py` (Step 5)
  to_skills:
  - deploy-handover
  to_roles:
  - plant key user
  done_when:
  - The JSON validates
  - The datasource UID is a `${DS_NAME}` placeholder
  - Schema, plugin and Grafana versions are declared in `__requires`
  signoff: plant key user
- id: panel-sql
  form: Queries inside the JSON
  to_skills:
  - ops-analytics-asset
  to_roles: []
  done_when:
  - Every query uses the Grafana time macros, is PostgreSQL and DuckDB compatible, and every defined variable is used in each relevant panel
  signoff: OD lead
- id: audit-record
  form: The Step 6 checklist, run before delivery
  to_skills: []
  to_roles:
  - Plant key user who imports the file
  done_when:
  - Every checklist item is ticked or the exception is stated
  - Portability passed on at least 5 representative panels on both PostgreSQL and DuckDB
  signoff: Plant key user who imports the file
- id: handover-facts
  form: Fields on the use-case record (per `OD-INTEGRATION.md`)
  to_skills:
  - deploy-handover
  to_roles: []
  done_when:
  - Output asset, business process, utilization expectation and named plant owner are recorded
  signoff: OD lead
receives_from:
- ops-analytics-asset
- catalog-usecase
- mi-data-availability
next:
- when: deploy-handover, then the plant owner.
  to:
  - deploy-handover
stops_when:
- the schema or archetype is not confirmed, a signal is not standardized or not available, the panel needs several plants at once (not a local dashboard), or a query fails the portability check
- Do not show a tracked saving as proven and do not turn an absence into a zero
