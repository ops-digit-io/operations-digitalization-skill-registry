name: validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml markdown
      - name: Registry, frontmatter and cross-references
        run: python3 scripts/validate_registry.py
      - name: Skill output contract and run record (tests)
        run: |
          python3 scripts/skill_outputs.py --check
          python3 scripts/skill_form.py
          python3 -m unittest discover -s scripts -p "test_skill_contract.py"
          python3 -m unittest discover -s skills/process-derivation/scripts -p "test_*.py"
      - name: Generated pages are current
        run: |
          python3 scripts/build_okf_index.py --check
          python3 scripts/build_bpmn.py --check
          python3 scripts/build_skill_quality.py --check
      - name: Skills against the open Agent Skills specification (strict export must be valid)
        run: python3 scripts/agent_skills_spec.py --export dist/skills
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the documentation site
        run: python3 scripts/build_site.py --out site --repo-url "${{ github.server_url }}/${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 30
