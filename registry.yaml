# MPEE Operations Digitalization — Skill Registry
# Derived from the ops-knowledge-graph bundle. Regenerate the derivation notes in
# docs/derivation.md when a source concept changes. Validate with scripts/validate_registry.py.

registry:
  name: operations-digitalization-skill-registry
  version: 1.9.0
  department: MPEE Operations Digitalization (OD)
  business: neuwerk
  owner: Jakob Gabriel
  language: en
  format: Agent Skills (SKILL.md with YAML frontmatter)
  derived_from:
    repo: ops-digit-io/ops-knowledge-graph
    bundle: _knowledge/ (Open Knowledge Format v0.2)
    maps:
      - name: Skill map
        paths:
          - _knowledge/OperationsDigitalization-Department/20-lanes/*/skills.md
          - _knowledge/OperationsDigitalization-Department/20-lanes/*/tasks.md
          - _knowledge/OperationsDigitalization-Department/20-lanes/*/playbook.md
          - _knowledge/OperationsDigitalization-Department/20-lanes/*/metrics.md
          - _knowledge/OperationsDigitalization-Department/20-lanes/*/agent-brief.md
      - name: Node-RED flow corpus
        paths:
          - _knowledge/node-red-auto-docs/docs/**          # exported flow JSON + generated pages
          - _knowledge/node-red-auto-docs/generate_docs.py
      - name: Machine estate and integration guidance
        paths:
          - _knowledge/_apps/machine-integration-guidance-app/rules.json
          - _knowledge/_apps/machine-integration-guidance-app/rules-next.json
          - _knowledge/machine-integration-guidance-app/dataFEEDOPCSuite_de.pdf  # Softing dataFEED OPC Suite V5.70 manual (LFS)
          - _knowledge/90-Sources/generated/kg_nodes.csv    # Machine and Connector nodes
      - name: Operations Digitalization department map
        paths:
          - _knowledge/OperationsDigitalization-Department/00-core/*.md
          - _knowledge/OperationsDigitalization-Department/10-modules/smart-factory-use-case/*.md
          - _knowledge/10-Department/*.md
          - _knowledge/20-Done/*.md
    excluded:
      - _knowledge/260825_DU_Pilot_Business-Cases.md   # Digital Unit — a new department, out of scope
      - _knowledge/90-Sources/du-overview/**            # Digital Unit source material, out of scope
  vendored:
    - id: build-grafana-ops-dashboard
      source: author's skill, uploaded 2026-08-25
      modified: frontmatter metadata block added; body and references unchanged
  data_as_of: 2026-08-10          # Scorecard / Power BI figures
  graph_as_of: 2026-08-24         # portfolio and ledger figures from the knowledge bundle
  flows_as_of: 2026-08-25         # Node-RED corpus and machine estate
  status: draft                   # unverified — drafted from the bundle, not yet read line by line

tiers:
  foundation: Shared ground truth every other skill loads first.
  lane: One per OD service line — the whole lane end to end.
  practice: One repeatable procedure, composable across lanes.
  technical: Hands-on build guidance for a specific technology, with reference material.

skills:
  - id: od-context
    tier: foundation
    lane: all
    owner_role: OD lead (Thomas Zipf)
    authority_level: read-only
    summary: Vocabulary, service lines, systems of record, decision gates and the honesty rules.

  - id: od-use-case-support-service
    tier: lane
    lane: use-case-support-service
    owner_role: Digital-Business-Value-Engineer (DBVE)
    authority_level: draft on definitions and reports; recommend on prioritization
    trigger: Plant use-case demand or a definition-workshop request.
    definition_of_done: Use case defined, prioritized, impact-evaluated and handed to integration with a business case.

  - id: od-information-integration-service
    tier: lane
    lane: information-integration-service
    owner_role: IIoT Interface & Automation Engineer (IIAE)
    authority_level: read-only on production/edge; draft on roadmaps and reports; recommend on sequencing
    trigger: Equipment integration or data-model harmonization need per roadmap.
    definition_of_done: Machine or equipment integrated, signals standardized, data landing on the data platform.

  - id: od-project-support-consultancy
    tier: lane
    lane: project-support-consultancy
    owner_role: IIoT Interface & Automation Engineer (IIAE)
    authority_level: read-only on systems; draft on project artefacts; recommend on sequencing
    trigger: Digital investment project kick-off.
    definition_of_done: Integration project managed to acceptance test; application consulted and accepted.

  - id: od-analytical-support-service
    tier: lane
    lane: analytical-support-service
    owner_role: Digital-Business-Value-Engineer (DBVE)
    authority_level: read-only on data sources; draft on assets and summaries; recommend on promotion
    trigger: Analytical request or ad-hoc process-insight need.
    definition_of_done: Process diagnostics / analytical insight delivered.

  - id: od-use-case-intake-triage
    tier: practice
    lane: all
    owner_role: OD lead (Thomas Zipf)
    authority_level: recommend
    summary: Accept, refuse or route an incoming request; name the lane, the trigger and the gate.

  - id: od-system-fit-check
    tier: practice
    lane: all
    owner_role: Digital-Business-Value-Engineer (DBVE) / IIoT Interface & Automation Engineer (IIAE), whichever lane the request entered through
