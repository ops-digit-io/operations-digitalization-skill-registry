# MPEE Operations Digitalization — Skill Registry
# Derived from the ops-knowledge-graph bundle. Regenerate the derivation notes in
# docs/derivation.md when a source concept changes. Validate with scripts/validate_registry.py.

registry:
  name: operations-digitalization-skill-registry
  version: 2.0.0
  department: MPEE Operations Digitalization (OD)
  business: neuwerk
  owner: Jakob Gabriel
  language: en
  format: Agent Skills (SKILL.md with YAML frontmatter)
  derived_from:
    repo: ops-digit-io/ops-knowledge-graph
    bundle: _knowledge/ (Open Knowledge Format v0.2)
    maps:
      - name: Skill map
        paths:
          - _knowledge/OperationsDigitalization-Department/20-lanes/*/skills.md
          - _knowledge/OperationsDigitalization-Department/20-lanes/*/tasks.md
          - _knowledge/OperationsDigitalization-Department/20-lanes/*/playbook.md
          - _knowledge/OperationsDigitalization-Department/20-lanes/*/metrics.md
          - _knowledge/OperationsDigitalization-Department/20-lanes/*/agent-brief.md
      - name: Node-RED flow corpus
        paths:
          - _knowledge/node-red-auto-docs/docs/**          # exported flow JSON + generated pages
          - _knowledge/node-red-auto-docs/generate_docs.py
      - name: Machine estate and integration guidance
        paths:
          - _knowledge/_apps/machine-integration-guidance-app/rules.json
          - _knowledge/_apps/machine-integration-guidance-app/rules-next.json
          - _knowledge/machine-integration-guidance-app/dataFEEDOPCSuite_de.pdf  # Softing dataFEED OPC Suite V5.70 manual (LFS)
          - _knowledge/90-Sources/generated/kg_nodes.csv    # Machine and Connector nodes
      - name: Operations Digitalization department map
        paths:
          - _knowledge/OperationsDigitalization-Department/00-core/*.md
          - _knowledge/OperationsDigitalization-Department/10-modules/smart-factory-use-case/*.md
          - _knowledge/10-Department/*.md
          - _knowledge/20-Done/*.md
    excluded:
      - _knowledge/260825_DU_Pilot_Business-Cases.md   # Digital Unit — a new department, out of scope
      - _knowledge/90-Sources/du-overview/**            # Digital Unit source material, out of scope
  vendored:
    - id: build-grafana-ops-dashboard
      source: author's skill, uploaded 2026-08-25
      modified: frontmatter metadata block added; body and references unchanged
  data_as_of: 2026-08-10          # Scorecard / Power BI figures
  graph_as_of: 2026-08-24         # portfolio and ledger figures from the knowledge bundle
  flows_as_of: 2026-08-25         # Node-RED corpus and machine estate
  status: draft                   # unverified — drafted from the bundle, not yet read line by line

tiers:
  foundation: Shared ground truth every other skill loads first.
  lane: One per OD service line — the whole lane end to end.
  practice: One repeatable procedure, composable across lanes.
  technical: Hands-on build guidance for a specific technology, with reference material.

skills:
  - id: od-context
    library: core
    tier: foundation
    lane: all
    owner_role: OD lead
    authority_level: read-only
    summary: Vocabulary, service lines, systems of record, decision gates and the honesty rules.

  - id: od-use-case-intake-triage
    library: core
    tier: practice
    lane: all
    owner_role: OD lead
    authority_level: recommend
    summary: Accept, refuse or route an incoming request; name the lane, the trigger and the gate.

  - id: od-system-fit-check
    absorbed: [od-application-consulting]   # merged 2026-11-10, see log.md
    library: core
    tier: practice
    lane: all
    owner_role: Digital-Business-Value-Engineer (DBVE) / IIoT Interface & Automation Engineer (IIAE), whichever lane the request entered through
    authority_level: recommend — flags the fit risk and proposes a redesign or an escalation; never approves a system change or a rollout exception itself
    summary: Catch the request that quietly needs a system outside the lean footprint — checks a stated need against each lightweight tool's own boundary and this plant's actual availability, resolves to fits/redesign/escalate.

  - id: od-requirements-breakdown
    library: core
    tier: practice
    lane: [lane-2, lane-3]
    owner_role: DBVE or IIAE, per lane
    authority_level: draft the requirement; accept or refuse per intake; approvals are human
    summary: Turns an accepted demand into a requirement another lane can act on - problem, standard baseline, verified signal list, testable acceptance, legacy-system assessment, the lane handover packet, and a standardized epic carrying a background description and at least two user stories. Covers all four service lines.

  - id: od-use-case-definition
    library: core
    tier: technical
    lane: lane-2
    owner_role: Digital-Business-Value-Engineer (DBVE)
    authority_level: draft
    summary: Scope one plant's instance of one need through four phases to a benefit case ready for od-benefit-calculation — a proven library, the abstract patterns behind them, and the Benefits Dependency Network linking the build to the change that makes it land.

  - id: od-use-case-solution-evaluation
    absorbed: [od-maturity-assessment]   # merged 2026-11-10, see log.md
    library: extension
    tier: practice
    lane: lane-2
    owner_role: Digital-Business-Value-Engineer (DBVE)
    authority_level: draft on the evaluation and target levels; recommend on sequencing; never approve an investment
    summary: Rank a scoped use case against a case library as a fast pre-check, then profile its complexity drivers, find which IT/OT capability areas its solution depends on, and sequence any as-is/target gap — a visualized ranking and a total evaluation score resolving to ready/raise-capability/over-engineered/escalate.

  - id: od-benefit-calculation
    library: core
    tier: practice
    lane: [lane-2, lane-3]
    owner_role: Digital-Business-Value-Engineer (DBVE)
    authority_level: draft on the business case; recommend on prioritization; never assert proven
    summary: Build the OD business case and write saving rows; keep tracked and proven apart.

  - id: od-use-case-standardization
    absorbed: [od-use-case-promotion]   # merged 2026-11-10, see log.md
    library: extension
    tier: practice
    lane: lane-2
    owner_role: Digital-Business-Value-Engineer (DBVE)
    authority_level: recommend
    summary: Capability templates, the reference library, the CSP gate and the twelve cluster tags.

  - id: od-equipment-integration
    absorbed: [od-barrier-triage, od-information-integration-service, od-machine-integration-plan]   # merged 2026-11-10, see log.md
    library: core
    tier: technical
    lane: [lane-1, lane-3]
    owner_role: IIoT Interface & Automation Engineer (IIAE)
    authority_level: draft on assessments and roadmaps; recommend a route and a configuration; never connect, never approve an external connection
    summary: Two entry routes to one protocol — assess a plant/wave and build its integration roadmap, or route and configure a single machine already in scope. Merger of the former assessment and guidance skills, 2026-09-17.


  - id: od-acceptance-test
    library: core
    tier: practice
    lane: lane-3
    owner_role: IIoT Interface & Automation Engineer (IIAE)
