open_gaps:
  - No flow owner is named for the end-to-end value chain; the Project Support requirement variant asks for one and 12-portfolio.md marks it to-confirm.
  - comment, methods, actions, utilization and csp_decision are not populated on the use cases; the requirement template asks for what those fields were meant to hold.
  - A large share of legacy applications carries an unknown licence position or no support concept.
  # Corrections applied here that are NOT yet fixed in the knowledge bundle — see docs/derivation.md
  - MDL and ContiTech are fixed in the bundle as well (ops-knowledge-graph, same branch). The raw 90-Sources decks still say the old thing and are never hand-edited.
  - Grafana is a LOCAL instance per plant for that plant's manufacturing dashboards; Databricks and the Azure Storage Account are the GLOBAL layer. Do not point a plant's Grafana at the global platform, and do not build a cross-plant view on a local one.
  - The local datasource each plant's Grafana reads - engine, and whether it is uniform across sites - is not recorded.
  - Data platform detail not recorded anywhere - access paths, workspace and container naming, catalog layout, and how far back history is kept.
  - Decision counterpart for tool/system rollout where ContiTech used to sit is still to-confirm (data-model / signal standardization is resolved: Plant ME / Plant IT, 2026-10-22).
  - The business is now neuwerk (former OESL); the registry has not been renamed and the bundle still says OESL.
  - Named owners per lane — role labels (DBVE, IIAE) only today; deputy for the OD lead unconfirmed.
  - Target lead time per lane.
  - Value delivery cycle (demand → live use case) — confirmed 2026-10-22 as not captured in any system today; still needs a source system built, not just a definition.
  - Budget figure and investment threshold.
  - MES / MDA-PDA interface detail, write rights and freshness.
  - A dedicated OD use-case one-pager / business-case template.
  - Node-RED site-code table — only qda, spr and cshz are resolvable to plant names from the bundle.
  - Three integration routes are marked TODO in rules.json (Beckhoff on edge, Modbus on edge, OPC-UA on the aggregation server); B&R INA2000 on aggregation and Omron NJ on edge are stubs.
  - Concept 2 (container-based machine integration, ingress variant 2) has one deployment (Carei) and no written route in rules.json.
  - Some plants have no integration concept recorded at all.
  - rules.json tells users to select a "Beckhoff" data source with an "ADS" protocol in Softing dataFEED. V5.70 has neither — Beckhoff has no fully-written route on either platform. Fix in rules.json.
  - rules.json lists "Netlink" as a Siemens protocol option. Discontinued in dataFEED V5.38; legacy configurations should migrate to Siemens S7. Fix in rules.json.
  - Whether any OESL plant still runs a NetLink-based dataFEED configuration.
  - The two OESL "Machine Integration — Softing DataFeed" guideline documents are referenced by rules-next.json but not attached to the bundle.
  - production_criticality, cyber_security_status, machine_blockers and input_protocol are empty on the machine rows.
  - Some flows carry literal secrets (Teams webhook URLs, Bearer tokens) committed in Node-RED flow JSON. Rotate; they are in git history.
  - Some flows have a sysTime defect (never unpacked, never re-packed, or unpaired) - every downstream timestamp in those is wrong and nothing errors.
  - Some flows send more than one protobuf oneof member to the encode.
  - Many flows never set an output UUID, so a derived packet publishes under the input data point's identity.
  - Some flows have a severed pipeline (decode/split/encode/mqtt-out with no inbound wire).
  - node.error and node.status are almost unused across the flows - dropped messages are essentially unobservable.
  - Subflow contents are not in the per-flow exports; five subflows are in use and must be read on the instance.
  - The per-flow exports contain zero config nodes (mqtt-broker, protobuf-file). Verified by deploying a generated flow to Node-RED v5.0.4: it needs node-red-contrib-protobuf plus hand-added config nodes before it starts.
  - The estate's `file` nodes use the pre-V3 filename form. Any flow generated with filenameType "msg" must set filename to the message property name, or it writes nothing and logs no error.
  - Timezone convention for shift and day boundaries in Node-RED flows is not recorded.
  - No written unit/scale convention for signals. CycleTime is seconds by convention while MetersPerMinute carries its unit in the name - the two contradict.
  - The data-point contract carries only uuid and label: no unit, scale, data type or collection method. Everything standardization needs sits outside it.
  - documentation_available and documentation_link exist as fields on the machine rows and are populated on none of them - the machine context this skill needs is recorded nowhere.
  - Several vendor connectors are recorded as idea, in development or do-not-use, so they cannot be relied on; for some of them no start date is recorded.
  - DTQ-MODBUS-Connector carries status Idea and utilization USE, which cannot both be true. Modbus/TCP machines exist and the route is unconfirmed.
  - documentation_available is NO on nearly all connectors; only DTQ-FTP2MIL-Connector and SFT-OPC-Suite have anything written down.
  - Some vendor machines have no available vendor connector. Whether their controllers expose OPC UA has not been confirmed per machine.
  - Step 5 of the availability check - granularity, freshness and completeness per signal - is recorded in no source in the bundle. It can only be answered against Databricks and the Azure Storage Account directly.
  - Some plants have no Node-RED instance, so the flow corpus cannot speak to signal availability for them.
  - The `nomz` Node-RED instances map to no plant in the bundle. Northeim is the largest plant with no flow evidence; the two facts may fit together and nobody has confirmed it.
  - plc_vendor holds non-vendor values on some machine rows, so those machines match no connector and read as a gap that is a data-entry error.
  - Machines can be INTEGRATED with no integration_method recorded, so their ingress variant - and with it what is actually published - cannot be inferred from the row.
  - "Every concept in this bundle is OKF-unverified: derived from the knowledge graph and the source systems, but not read line by line by a person. Adding a `verified` stamp naming a human actor is a reading job nobody has been assigned."
  - The epic/user-story layer exists in the use case list already and is hollow: few leaf stories carry an "I want" tag or acceptance criteria, and none carries a "so that" that differs from the generated clause. Backfilling them is a portfolio exercise nobody has been assigned.
  - Many leaf use cases carry only a capability parent or only a process parent, so a rollup on either axis silently misses part of the portfolio. Whether the source list can be corrected in place is unconfirmed.
  - Tags arrive in the plant language. The corpus already carries Chinese, German and Spanish labels; Romanian, French, Hungarian, Serbian, Slovak/Czech and Portuguese plants are in scope and not yet represented.
  - The data-point contract has one label field, so a local-language name cannot be carried alongside the canonical one. Whether the edge platform can hold a second display field is unconfirmed.
  - The term table covers nine languages and is a starting point; each plant's entries need a native speaker's confirmation.
  - Many distinct signal names exist for a far smaller set of concepts (several for machine state alone). Misspelled names are referenced widely and are now an interface.
  - Which machines already expose an OPC UA companion specification (OPC UA for Machinery, EUROMAP 77/83/84) is not recorded anywhere; it would change the integration route for each of them.
  - Whether the machine purchase requirement spec (PRS, Doc ID 215534) asks for a companion specification - a one-line change with a large downstream effect.
  - Whether the CT Base data model was derived from a public model or independently; that decides whether adoption is a migration or a reconciliation.
  - business_process and targets are populated on only part of the use cases, so any demand ranking derived from them sees a fraction of the portfolio.
  - Two timestamp envelopes coexist: packed sysTime/plcTime on protobuf topics, and a formatted local-time string on JSON topics. No stated rule on which to use where.
