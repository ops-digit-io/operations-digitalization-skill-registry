# The new-state process flow as data: the owner's process flow (OD_NewState_ProcessFlow.html, new-state service lanes
# with skills & gaps). Core = exactly the skills drawn on its steps (skills/); the net-new builds it lists (catalog-usecase,
# catalog-systems, catalog-guardrails, deploy-appstore, it-demand-package, prototype/PoC = od-prototype-poc,
# capital-request = od-capital-request) are placed on their steps. `proposed` = extension skills (skills-extension/), not drawn.
# Step ids are stable keys that skills cite.
intake:
  title: Intake
  who: Triage + fit-check
  summary: 'Known use case: Lane 1. New use case, machine connected: Lane 2. New system / connector: Lane 3.'
  steps:
  - id: i1
    title: Known use case?
    skills:
    - od-use-case-intake-triage
    - od-system-fit-check
    proposed:
    - od-first-aid-kit
    - od-event-object-modelling
lanes:
- id: lane1
  title: Run a known use case
  who: Self-service
  summary: 'Fall-through: not truly catalogued to Lane 2; no standard system fits to Lane 3.'
  branches:
  - id: 1a
    title: Machine already connected (no spend)
    steps:
    - id: 1a1
      title: Pick from catalog
      skills:
      - catalog-usecase
      proposed: []
    - id: 1a2
      title: Apply template
      skills:
      - od-analytics-asset-build
      proposed:
      - od-template-resolution
      - ops-dashboard-datatron
      - build-grafana-ops-dashboard
    - id: 1a3
      title: Validate & go live
      skills:
      - catalog-guardrails
      proposed:
      - od-rollout-training
  - id: 1b
    title: 'Not connected: standardized-system onboarding (predictable spend via cost template)'
    steps:
    - id: 1b1
      title: Pick UC + std system
      wait: ~d
      skills:
      - catalog-usecase
      - catalog-systems
      proposed: []
    - id: 1b2
      title: Cost template + approval
      wait: ~wks
      skills:
      - od-decision-routing
      proposed:
      - od-investment-input
    - id: 1b3
      title: Order & connect system
      skills:
      - od-equipment-integration
      proposed:
      - od-cybersec-gate
    - id: 1b4
      title: Apply template & go live
      skills:
      - od-analytics-asset-build
      proposed:
      - od-rollout-training
      - ops-dashboard-datatron
- id: lane2
  title: Develop a new use case
  who: OD-led
  summary: 'Chains out: needs new software to Lane 3a; needs new connection to Lane 3b; proven & repeatable to catalog, then Lane 1.'
  branches:
  - id: '2'
    title: Use-case funnel
    steps:
    - id: '21'
      title: Define & diagnose
      skills:
      - od-use-case-definition
      proposed:
      - od-workshop-facilitation
      - od-first-aid-kit
      - od-event-object-modelling
    - id: '22'
      title: Features + data check
      skills:
      - od-requirements-breakdown
      - od-data-availability-check
      proposed:
      - od-use-case-solution-evaluation
      - od-event-object-modelling
      - funnel-features
    - id: '23'
      title: Prototype / validate
      skills:
      - od-analytics-asset-build
      - od-prototype-poc
      proposed:
      - od-governance-cadence
    - id: '24'
      title: Business case + rank
      wait: ~wks
      skills:
      - od-benefit-calculation
      - bc-assessment
      proposed:
      - od-portfolio-and-savings-analysis
      - od-plant-diagnosis
      - od-investment-input
    - id: '25'
      title: Capital request
      skills:
      - od-decision-routing
      - od-capital-request
      proposed:
      - od-project-order
    - id: '26'
      title: Implement & graduate
      skills:
      - od-handover-and-adoption
      - catalog-usecase
      proposed:
      - od-use-case-standardization
      - od-rollout-training
      - od-project-order
      - ops-dashboard-datatron
- id: lane3
  title: New system or connector
  who: OD / Ext / IT-CS
  summary: Shared front-end (requirements, tool-decision gate, business case + capital), then 3a.1 reuse app, 3a.2 self dev, 3a.3 external dev, 3a.4 integrate foreign app via IT-CS, or 3b new connector.
  branches:
  - id: front
    title: 'Shared front-end: requirements, tool-decision gate, clear demand'
    steps:
    - id: '31'
      title: Requirements
      skills:
      - od-requirements-breakdown
      proposed:
      - od-workshop-facilitation
    - id: '32'
      title: Tool-decision gate
      wait: ~wks
      skills:
      - od-system-fit-check
      - od-decision-routing
      proposed:
      - od-migration-cutover
    - id: '33'
      title: Business case + capital
      skills:
      - od-benefit-calculation
      - od-capital-request
      proposed:
      - od-project-order
  - id: 3a
    title: 'New system: make / buy / integrate'
    steps:
    - id: 3a4
      title: Package / build
      wait: CS ~wks
      skills:
      - it-demand-package
      proposed:
      - od-project-order
      options:
      - id: 3a.1
        owner: OD + Ext
        title: Available codebase / app
        text: Reuse an existing app; deploy to the platform. Lowest effort.
        skills:
        - deploy-appstore
      - id: 3a.2
        owner: Self dev
        title: New codebase (self dev)
        text: OD/internal builds the app, then deploys.
        skills:
        - od-equipment-integration
        - deploy-appstore
      - id: 3a.3
        owner: External
        title: New codebase (external dev)
        text: Spec in-house, build with an external partner (DevOps via externals).
        skills:
        - it-demand-package
        note: + ext dev
      - id: 3a.4
        owner: IT·CS
        title: Integrate a foreign app
        text: Integrate a third-party app via IT Demand + Cyber Security. The integrate-only path.
        skills:
        - it-demand-package
    - id: 3a5
      title: Deploy to platform + CS
      skills:
      - deploy-appstore
      proposed:
      - od-cybersec-gate
      - od-migration-cutover
    - id: 3a6
      title: Rollout & adopt
      skills:
      - od-handover-and-adoption
      proposed:
      - od-rollout-training
      - od-migration-cutover
  - id: 3b
    title: New connector for a new machine
    steps:
    - id: 3b4
      title: Connector + pipeline to the data platform
      wait: proc ~wks
      skills:
      - od-equipment-integration
      - od-signal-standardization
      - od-node-red-flow-builder
      proposed:
      - od-cross-plant-compatibility
    - id: 3b5
      title: Procure & connect machine
      wait: CS ~wks
      skills:
      - od-equipment-integration
      proposed:
      - od-cybersec-gate
    - id: 3b6
      title: Acceptance + CS → live
      skills:
      - od-acceptance-test
      proposed: []
spine:
  title: Foundation
  summary: Not a step; every skill reads it first.
  skills:
  - od-context
  proposed:
  - od-ai-generation-playbook
  - od-scorecard-reporting
  - od-context-freshness
  - od-template-resolution
  - od-retro
  - od-risk-watch
  - od-plant-onboarding
  - od-governance-cadence
  - od-plant-diagnosis
  - od-sharepoint-list-export
unplaced:
  title: Not placed in the flow
  summary: Registry skills the flow does not place. Empty since the merge of 2026-11-10; the three old lane orchestrators were absorbed (see log.md).
  skills: []
