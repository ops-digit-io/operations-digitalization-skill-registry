# The new-state process flow as data: lanes, branches, steps, and the skills that serve each step.
# Source of the structure: the four New-State files in this folder (OD_NewState_*). The generated pages
# (site/ and docs/new-state-skill-map.md) are built from this file and registry.yaml; edit here, not there.
#
# For every step:
#   skills:   the skills the New-State files name for the step
#   proposed: skills this registry places on the step; the New-State files do not name them
#   wait:     an external wait after the step, as the files give it ("~wks" etc.)
# A skill may appear on several steps.

intake:
  title: Intake
  who: Triage and fit check
  summary: One lane per demand. Decide whether the use case is known, new on a connected machine, or needs a new system or connector.
  steps:
    - id: i1
      title: Classify the demand
      text: Known use case runs in Lane 1; a new use case on a connected machine goes to Lane 2; a new system or connector goes to Lane 3.
      skills: [od-use-case-intake-triage, od-system-fit-check]
      proposed: [od-first-aid-kit, od-event-object-modelling, od-ai-generation-playbook]

lanes:
  - id: lane1
    title: Run a known use case
    who: Self-service
    summary: The plant picks a catalogued use case and runs it; OD supplies the catalog, the standard systems, the cost template and the guardrails.
    branches:
      - id: 1a
        title: Machine already connected
        steps:
          - id: 1a1
            title: Pick from the catalog
            skills: [od-catalog]
          - id: 1a2
            title: Apply the standardized template
            skills: [od-analytics-asset-build, build-grafana-ops-dashboard]
            proposed: [od-template-resolution]
          - id: 1a3
            title: Validate and go live
            skills: [od-catalog]
            proposed: [od-rollout-training, od-utilization-review]
      - id: 1b
        title: Machine not connected, standardized-system onboarding
        steps:
          - id: 1b1
            title: Pick the use case and the standard system
            skills: [od-catalog]
            proposed: [od-maturity-assessment]
          - id: 1b2
            title: Cost template and lightweight approval
            wait: "~d"
            skills: [od-decision-routing]
            proposed: [od-investment-input]
          - id: 1b3
            title: Order and connect the system
            wait: "~wks"
            skills: [od-equipment-integration, od-cybersec-gate]
            proposed: [od-machine-integration-plan]
          - id: 1b4
            title: Apply the template and go live
            skills: [od-analytics-asset-build]
            proposed: [od-catalog]

  - id: lane2
    title: Develop a new use case
    who: OD-led
    summary: The full funnel for a genuinely new use case on a connected machine. A proven, repeatable result graduates into the catalog and becomes a Lane 1 case.
    branches:
      - id: "2"
        title: Use-case funnel
        steps:
          - id: "21"
            title: Define and diagnose
            skills: [od-use-case-definition]
            proposed: [od-workshop-facilitation, od-first-aid-kit, od-event-object-modelling]
          - id: "22"
            title: Features and data check
            skills: [od-requirements-breakdown, od-data-availability-check, od-use-case-solution-evaluation]
            proposed: [od-machine-integration-plan, od-event-object-modelling, od-maturity-assessment]
          - id: "23"
            title: Prototype and validate
            skills: [od-analytics-asset-build, od-prototype-poc]
            proposed: [od-governance-cadence]
          - id: "24"
            title: Business case and rank
            skills: [od-benefit-calculation, od-portfolio-and-savings-analysis]
            proposed: [od-use-case-prioritization, od-plant-diagnosis]
          - id: "25"
            title: Capital request
            wait: "~wks"
            skills: [od-decision-routing, od-capital-request]
            proposed: [od-investment-input, od-project-order]
          - id: "26"
            title: Implement and graduate to the catalog
            skills: [od-analytics-asset-build, od-handover-and-adoption, od-use-case-standardization, od-catalog]
            proposed: [od-impact-evaluation, od-use-case-promotion, od-rollout-training, od-utilization-review, od-project-order]

  - id: lane3
    title: New system or connector
    who: OD front-end, external, IT and Cyber Security
    summary: A shared front-end (requirements, tool decision, business case) and then two branches. 3a introduces a new system, 3b connects a new machine.
    branches:
      - id: front
        title: Shared front-end
        steps:
          - id: "31"
            title: Requirements
            skills: [od-requirements-breakdown]
            proposed: [od-workshop-facilitation]
          - id: "32"
            title: Tool decision and IT gate
            skills: [od-system-fit-check, od-decision-routing]
            proposed: [od-application-consulting, od-migration-cutover, od-maturity-assessment]
          - id: "33"
            title: Business case and capital
            wait: "~wks"
            skills: [od-benefit-calculation, od-capital-request]
            proposed: [od-investment-input, od-project-order]
      - id: 3a
        title: New system (make, buy, integrate)
        steps:
          - id: 3a4
            title: Package or build the app
            skills: [it-demand-package]
            proposed: [od-application-consulting, od-project-order]
          - id: 3a5
            title: Deploy to the platform and Cyber Security
            wait: "CS ~wks"
            skills: [deploy-appstore, od-acceptance-test, od-cybersec-gate]
            proposed: [od-migration-cutover]
          - id: 3a6
            title: Rollout and adopt
            skills: [od-handover-and-adoption]
            proposed: [od-rollout-training, od-migration-cutover, od-utilization-review]
      - id: 3b
        title: New connector for a new machine
        steps:
          - id: 3b4
            title: Connector and pipeline to the data platform
            skills: [od-equipment-integration, od-signal-standardization, od-node-red-flows]
            proposed: [od-barrier-triage, od-cross-plant-compatibility, od-machine-integration-plan, od-maturity-assessment]
          - id: 3b5
            title: Procure and connect the machine
            wait: "procurement ~wks"
            skills: [od-equipment-integration, od-node-red-flows]
          - id: 3b6
            title: Acceptance and Cyber Security, live on the data platform
            wait: "CS ~wks"
            skills: [od-acceptance-test, od-cybersec-gate]

spine:
  title: Supporting spine
  summary: Skills that apply across the lanes and are not drawn as steps.
  skills: [od-context, od-scorecard-reporting, od-portfolio-and-savings-analysis, od-sharepoint-list-export, od-ai-generation-playbook]
  proposed: [od-context-freshness, od-template-resolution, od-retro, od-risk-watch, od-plant-onboarding, od-governance-cadence, od-plant-diagnosis, od-utilization-review]

unplaced:
  title: Not placed in the flow
  summary: Registry skills that the New-State files do not place. The flow leaves their future open; see docs/new-state-flow.md.
  skills: [od-information-integration-service, od-project-support-consultancy, od-analytical-support-service]
